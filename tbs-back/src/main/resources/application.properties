spring.application.name=travel-buddy-split

spring.jpa.hibernate.ddl-auto=validate           # Flyway gère le schéma
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Importe un fichier .env (ou .env.local) s'il existe à la racine du projet
spring.config.import=optional:file:.env.local,optional:file:.env

